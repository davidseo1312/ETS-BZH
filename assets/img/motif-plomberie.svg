<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Motif de réseau de plomberie, raccordable à l'infini :
       les tuyaux traversent les bords aux mêmes coordonnées (x=60, y=90, y=300). -->
  <g fill="none" stroke="#FFFFFF" stroke-width="13">
    <path d="M0 90h400"/>
    <path d="M60 0v400"/>
    <path d="M0 300h400"/>
    <path d="M330 90v210"/>
    <path d="M200 90v60"/>
  </g>

  <g fill="#FFFFFF">
    <!-- brides sur les tuyaux horizontaux -->
    <rect x="145" y="72" width="10" height="36"/>
    <rect x="252" y="72" width="10" height="36"/>
    <rect x="108" y="282" width="10" height="36"/>
    <rect x="268" y="282" width="10" height="36"/>
    <!-- brides sur les tuyaux verticaux -->
    <rect x="42" y="196" width="36" height="10"/>
    <rect x="42" y="336" width="36" height="10"/>
    <rect x="312" y="206" width="36" height="10"/>
  </g>

  <!-- vanne à volant sur le tuyau horizontal haut -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9">
    <path d="M296 90V64"/>
    <circle cx="296" cy="50" r="17"/>
    <path d="M279 50h34"/>
  </g>
  <rect x="284" y="78" width="24" height="14" fill="#FFFFFF"/>

  <!-- manomètre sur la colonne de droite -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9">
    <path d="M330 150h22"/>
    <circle cx="368" cy="150" r="16"/>
  </g>

  <!-- siphon en bas du piquage central -->
  <g fill="none" stroke="#FFFFFF" stroke-width="13">
    <path d="M200 150c0 26 22 26 22 0"/>
  </g>

  <!-- coude raccordant la colonne de gauche au tuyau bas -->
  <g fill="#FFFFFF">
    <rect x="42" y="84" width="36" height="12"/>
    <rect x="324" y="294" width="12" height="36"/>
  </g>
</svg>
